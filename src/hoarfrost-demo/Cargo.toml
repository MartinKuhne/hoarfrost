[package]
name = "hoarfrost-demo"
version = "0.14.1"
edition = "2024"
description = "A standalone runnable showcase of the hoarfrost UI framework"
license = "MIT"
publish = false

# The showcase is a library first and a window second: the module graph lives
# in `src/lib.rs` so a sibling crate can render the same sections headlessly,
# and `src/main.rs` is a thin shell over it.
[lib]
name = "hoarfrost_demo"
path = "src/lib.rs"

[[bin]]
name = "hoarfrost-demo"
path = "src/main.rs"

[dependencies]
hoarfrost = { path = "../hoarfrost", features = ["test-helpers", "all"] }
# Feature set MUST match `hoarfrost`'s exactly (PLAN C3) or the re-exported
# iced types on the two sides of the boundary do not line up. See
# `src/hoarfrost/Cargo.toml`.
iced = { version = "0.14.0", features = [
    "wgpu",
    "tiny-skia",
    "fira-sans",
    "advanced-shaping",
    "advanced",
] }

[dev-dependencies]
iced_test = "0.14.0"
# Already in the lock graph; used only to keep font fixtures off real user
# paths (`RUST-006`).
tempfile = "3"
