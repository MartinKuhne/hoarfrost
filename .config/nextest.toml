# cargo-nextest configuration for the hoarfrost workspace.
# Reference: https://nexte.st/docs/configuration/

[profile.default]
fail-fast = false
retries = 2
test-threads = "num-cpus"
slow-timeout = "30s"

# Fast profile for rapid local iteration (`cargo nextest run --profile fast`).
# Excludes slow tests and keeps terminal output concise.
[profile.fast]
inherits = "default"
default-filter = 'not test(/slow_/)'
status-level = "fail"
final-status-level = "fail"

# Profile used by CI (`cargo nextest run --profile ci`).
[profile.ci]
inherits = "default"
fail-fast = true
retries = 0
status-level = "fail"
final-status-level = "fail"
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'test(/slow_/)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'test(/slow_/)'
slow-timeout = { period = "60s", terminate-after = 5 }
